name: iOS Build

on:
  push:
    branches: [ main, release/* ]
    paths:
      - 'Desktop/insurance-field-app/ios/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Desktop/insurance-field-app/ios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Build for iPad Simulator
      run: |
        cd Desktop/insurance-field-app/ios
        xcodebuild \
          -project DeevoSentinel.xcodeproj \
          -scheme FieldInspector \
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4),OS=latest' \
          -configuration Debug \
          clean build \
          CODE_SIGNING_ALLOWED=NO
