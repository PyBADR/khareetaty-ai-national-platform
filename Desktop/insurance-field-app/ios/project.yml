name: DeevoSentinel
options:
  bundleIdPrefix: com.deevo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

settings:
  base:
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.deevo.sentinel.dev
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: false
    ENABLE_PREVIEWS: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.24.0"

targets:
  DeevoSentinel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FieldInspector
        excludes:
          - "*.md"
          - ".DS_Store"
          - "FieldInspectorTests"
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        INFOPLIST_FILE: FieldInspector/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.deevo.sentinel.dev
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
    info:
      path: FieldInspector/Info.plist
      properties:
        CFBundleDisplayName: Deevo Sentinel
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "This app needs camera access to capture inspection photos"
        NSPhotoLibraryUsageDescription: "This app needs photo library access to save and retrieve inspection photos"
        NSPhotoLibraryAddUsageDescription: "This app needs to save inspection photos to your photo library"

  DeevoSentinelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FieldInspector/FieldInspectorTests
        excludes:
          - "*.md"
          - ".DS_Store"
    dependencies:
      - target: DeevoSentinel
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deevo.sentinel.tests
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  DeevoSentinel:
    build:
      targets:
        DeevoSentinel: all
        DeevoSentinelTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeevoSentinelTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
