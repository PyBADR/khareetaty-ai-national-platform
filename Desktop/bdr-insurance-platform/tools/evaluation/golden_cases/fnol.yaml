- case_id: fnol_001
  version: 1.0.0
  module_name: fnol_triage
  title: High-value auto claim requiring adjuster review
  description: |
    Tests handling of high-value auto claims that exceed the $50K threshold.
    Should trigger human review due to monetary boundary violation.
  category: normal
  difficulty: medium
  tags:
    - auto
    - high-value
    - human-review
    - boundary-violation
  
  input_data:
    claim_id: CLM-2026-001
    claim_type: auto
    claim_amount: 75000.00
    policy_number: POL-AUTO-12345
    incident_date: "2026-01-15"
    description: "Total loss - vehicle collision with multiple vehicles on highway"
    claimant_name: "John Doe"
    claimant_phone: "+1-415-555-0001"
    location: "San Francisco, CA"
    police_report: true
    injuries_reported: false
  
  expected_outcome:
    decision_type: BOUNDED
    requires_human_review: true
    min_confidence: 0.7
    boundary_violations_allowed: 1
    must_pass_boundaries: false
    must_have_position: true
    must_have_explainability: true
    min_explainability_factors: 3
  
  status: active
  created_at: "2026-01-20T10:00:00Z"
  created_by: platform_team
  notes: |
    This is a baseline case for high-value claims.
    Expected to trigger monetary boundary ($50K threshold).

